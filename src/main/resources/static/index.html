<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PortOne Test</title>
</head>

<body>

<h1>포트원 테스트</h1>

<button id="payment-button">
    결제하기
</button>

<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

<script>

    console.log("HTML 로드됨");
    console.log("PortOne =", window.PortOne);

    document
        .getElementById("payment-button")
        .addEventListener("click", async function () {

            console.log("버튼 클릭됨");

            if (!window.PortOne) {
                console.error("PortOne SDK가 로드되지 않았습니다.");
                alert("PortOne SDK 로드 실패");
                return;
            }

            console.log("PortOne SDK 정상");

            // 결제 ID 생성
            //const paymentId =
            //    `pay-${crypto.randomUUID().replace(/-/g, "")}`;
            //
            //console.log("paymentId =", paymentId);

            try {

                // =========================
                // 1. 백엔드에 주문 생성
                // =========================

                console.log("주문 생성 요청");

                const createResponse = await fetch("/api/payments", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        orderName: "테스트 상품",
                        amount: 1000
                    })
                });

                if (!createResponse.ok) {
                    throw new Error("주문 생성에 실패했습니다.");
                }

                const payment = await createResponse.json();

                console.log("생성된 주문 =", payment);

                // 백엔드에서 생성한 paymentId 사용
                const paymentId = payment.paymentId;

                console.log(
                    "백엔드에서 받은 paymentId =",
                    paymentId
                );


                // =========================
                // 2. PortOne 결제 요청
                // =========================

                const response =
                    await window.PortOne.requestPayment({

                        storeId:
                            "store-e067ece3-a470-475e-be2e-1e8f5474018b",

                        channelKey:
                            "channel-key-b20bef71-5ea1-4757-b948-a0d43d1b792b",

                        paymentId: paymentId,

                        orderName: payment.orderName,

                        totalAmount: payment.amount,

                        currency: "CURRENCY_KRW",

                        payMethod: "CARD",

                        customer: {
                            fullName: "테스트 구매자",
                            phoneNumber: "010-1234-5678",
                            email: "test@example.com"
                        }
                    });


                console.log("결제 응답 =", response);


                // =========================
                // 3. 결제 실패
                // =========================

                if (response.code !== undefined) {

                    console.error(
                        "결제 실패:",
                        response.code,
                        response.message
                    );

                    alert(
                        "결제 실패: " +
                        response.message
                    );

                    return;
                }


                // =========================
                // 4. 결제 성공
                // =========================

                console.log("결제 성공!");

                console.log(
                    "검증할 paymentId =",
                    paymentId
                );


                // =========================
                // 5. Spring Boot에 검증 요청
                // =========================

                console.log(
                    "백엔드 결제 검증 요청 시작"
                );

                const verifyResponse =
                    await fetch("/api/payments/verify", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            paymentId: paymentId
                        })
                    });


                console.log(
                    "백엔드 HTTP 상태 =",
                    verifyResponse.status
                );


                // =========================
                // 6. 백엔드 응답
                // =========================

                const result =
                    await verifyResponse.json();

                console.log(
                    "백엔드 검증 결과 =",
                    result
                );


                if (verifyResponse.ok) {

                    alert("결제 검증 성공!");

                } else {

                    alert("결제 검증 실패!");

                }

            } catch (error) {

                console.error(
                    "결제 요청 중 예외 발생 =",
                    error
                );

            }

        });

</script>

</body>
</html>
